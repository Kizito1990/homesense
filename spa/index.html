<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeSense – Smart Home Platform</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-house-heart-fill me-2"></i>HomeSense
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-page="dashboard">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="rules">Automation Rules</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-page="devices">Devices & Rooms</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-4">

    <!-- Dashboard Page -->
    <section id="page-dashboard">
      <h2 class="mb-4">Dashboard</h2>
      <div class="alert alert-info">
        This is the main dashboard. We will show live house data here.
      </div>
    </section>

    <!-- Rules Page (hidden by default) -->
    <section id="page-rules" class="d-none">
      <h2 class="mb-4">Automation Rules</h2>
      <div class="alert alert-info">
        Here we will create and manage automation rules.
      </div>
    </section>

    <!-- Devices Page (hidden by default) -->
    <section id="page-devices" class="d-none">
      <h2 class="mb-4">Devices & Rooms</h2>
      <div class="alert alert-info">
        Here we will add/remove rooms, sensors and actuators.
      </div>
    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Our JavaScript files -->
  <script src="js/app.js"></script>
</body>
</html>
